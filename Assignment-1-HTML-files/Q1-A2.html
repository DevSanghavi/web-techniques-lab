<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Responsive Images Demo</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                line-height: 1.6;
            }
            .image-container {
                margin-bottom: 30px;
                padding: 15px;
                border: 1px solid #ddd;
                border-radius: 5px;
            }
            img {
                max-width: 100%;
                height: auto;
            }
        </style>
    </head>
    <body>
        <h1>HTML5 Image Demonstration</h1>

        <!-- 1. Standard Image with Alt Text -->
        <div class="image-container">
            <h3>1. Standard Image with Descriptive Alt Text</h3>
            <img
                src="https://picsum.photos/id/1015/300/200"
                alt="River valley landscape with green hills"
                width="300"
                height="200"
            />
        </div>

        <!-- 2. Responsive Image using srcset & sizes -->
        <div class="image-container">
            <h3>2. Responsive Image using 'srcset' (Resolution Switching)</h3>
            <img
                src="https://picsum.photos/id/1018/600/400"
                srcset="
                    https://picsum.photos/id/1018/300/200   300w,
                    https://picsum.photos/id/1018/600/400   600w,
                    https://picsum.photos/id/1018/1200/800 1200w
                "
                sizes="(max-width: 600px) 200px, (max-width: 1200px) 400px, 800px"
                alt="Mountain landscape that changes size with the screen"
            />
        </div>

        <!-- 3. Responsive Image using the <picture> Element -->
        <div class="image-container">
            <h3>3. Art Direction using the &lt;picture&gt; Element</h3>
            <picture>
                <!-- Large image for viewports 800px or wider -->
                <source
                    media="(min-width: 800px)"
                    srcset="https://picsum.photos/id/1039/800/400"
                />

                <!-- Medium image for viewports 500px or wider -->
                <source
                    media="(min-width: 500px)"
                    srcset="https://picsum.photos/id/1039/500/300"
                />

                <!-- Fallback img for smaller screens or unsupported browsers -->
                <img
                    src="https://picsum.photos/id/1039/300/300"
                    alt="Waterfall in a forest, cropped differently for each screen"
                />
            </picture>
        </div>
    </body>
</html>
