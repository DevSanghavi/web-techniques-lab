<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML5 Table with Rowspan and Colspan</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                line-height: 1.6;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px;
            }
            th,
            td {
                border: 1px solid #333;
                padding: 10px;
                text-align: center;
            }
            thead {
                background-color: #337ab7;
                color: white;
            }
            tfoot {
                background-color: #f5f5f5;
                font-weight: bold;
            }
            tbody tr:nth-child(even) {
                background-color: #f9f9f9;
            }
        </style>
    </head>
    <body>
        <h2>Student Marksheet Summary</h2>

        <table>
            <!-- Table Header Group -->
            <thead>
                <tr>
                    <th rowspan="2">Roll No</th>
                    <th rowspan="2">Student Name</th>
                    <th colspan="2">Marks Obtained</th>
                    <th rowspan="2">Grade</th>
                </tr>
                <tr>
                    <th>Web Techniques</th>
                    <th>Database Systems</th>
                </tr>
            </thead>

            <!-- Table Body Group -->
            <tbody>
                <tr>
                    <td>101</td>
                    <td>Rahul Sharma</td>
                    <td>85</td>
                    <td>90</td>
                    <td rowspan="2">A</td>
                    <!-- Vertical Span across 2 rows -->
                </tr>
                <tr>
                    <td>102</td>
                    <td>Priya Verma</td>
                    <td>88</td>
                    <td>92</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Amit Patel</td>
                    <td>75</td>
                    <td>78</td>
                    <td>B</td>
                </tr>
            </tbody>

            <!-- Table Footer Group -->
            <tfoot>
                <tr>
                    <td colspan="2">Total Students Passed</td>
                    <!-- Horizontal Span across 2 columns -->
                    <td colspan="3">3 Students</td>
                    <!-- Horizontal Span across 3 columns -->
                </tr>
            </tfoot>
        </table>
    </body>
</html>
