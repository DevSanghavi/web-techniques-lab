        <!-- ===================== SHORT JAVASCRIPT: only reads the JSON ===================== -->
        <script>
            var d = JSON.parse(document.getElementById("data").textContent); // text -> object
            var s = d.students;

            // Dataset details: every top-level key except the students array
            var info = "";
            for (var k in d) {
                if (k !== "students") {
                    info += k + ": " + d[k] + "\n";
                }
            }
            document.getElementById("info").textContent = info;

            // Summary calculated with array methods
            var avg =
                s.reduce(function (t, x) {
                    return t + x.attendancePercentage;
                }, 0) / s.length;
            var top = s.reduce(function (a, b) {
                return a.assignmentMarks.assignment1 +
                    a.assignmentMarks.assignment2 >=
                    b.assignmentMarks.assignment1 +
                        b.assignmentMarks.assignment2
                    ? a
                    : b;
            });
            document.getElementById("stats").textContent =
                "Records found     : " +
                s.length +
                " (totalRecords says " +
                d.totalRecords +
                ")\n" +
                "Average attendance: " +
                avg.toFixed(1) +
                "%\n" +
                "Fee not paid      : " +
                s.filter(function (x) {
                    return !x.isFeePaid;
                }).length +
                "\n" +
                "Top scorer        : " +
                top.fullName +
                "\n" +
                "No phone (null)   : " +
                s.filter(function (x) {
                    return x.phone === null;
                }).length;

            // Table: one row for each object in the array
            document.getElementById("tbl").innerHTML =
                "<tr><th>Roll</th><th>Name</th><th>City</th><th>Attendance</th><th>Fee</th><th>A1</th><th>A2</th><th>Skills</th><th>Mentor</th></tr>" +
                s
                    .map(function (x) {
                        return (
                            "<tr><td>" +
                            x.rollNo +
                            "</td><td>" +
                            x.fullName +
                            "</td><td>" +
                            x.address.city +
                            "</td><td>" +
                            x.attendancePercentage +
                            "</td><td>" +
                            (x.isFeePaid ? "Paid" : "Due") +
                            "</td><td>" +
                            x.assignmentMarks.assignment1 +
                            "</td><td>" +
                            x.assignmentMarks.assignment2 +
                            "</td><td>" +
                            x.skills.join(", ") +
                            "</td><td>" +
                            (x.mentor || "-") +
                            "</td></tr>"
                        );
                    })
                    .join("");

            // Raw JSON of the first record (object -> text)
            document.getElementById("raw").textContent = JSON.stringify(
                s[0],
                null,
                2,
            );
        </script>
