<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Web Techniques Lab | Assignments 1 & 2</title>
        <meta
            name="description"
            content="Live showcase of Web Techniques Assignment 1 and 2: HTML5, Bootstrap, JavaScript, DOM, jQuery and JSON programs. Run each program and read its source code."
        />

        <!-- ===================== CSS: "Aurora Midnight" theme ===================== -->
        <style>
            :root {
                --bg: #080b16;
                --bg2: #0f1426;
                --surface: rgba(255, 255, 255, 0.05);
                --surface2: rgba(255, 255, 255, 0.09);
                --line: rgba(255, 255, 255, 0.11);
                --text: #eef1ff;
                --muted: #9aa3c7;
                --glass: rgba(8, 11, 22, 0.72);
                --a1: #7c5cff;
                --a2: #22d3ee;
                --a3: #ff6bcb;
                --grad: linear-gradient(135deg, #7c5cff, #22d3ee);
                --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
                --hh: 64px;
                --sw: 260px;
            }
            [data-theme="light"] {
                --bg: #f3f5ff;
                --bg2: #ffffff;
                --surface: rgba(255, 255, 255, 0.85);
                --surface2: #e9edff;
                --line: rgba(30, 40, 90, 0.13);
                --text: #141a35;
                --muted: #5a6289;
                --glass: rgba(243, 245, 255, 0.8);
                --shadow: 0 12px 34px rgba(60, 70, 140, 0.18);
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family:
                    Inter,
                    "Segoe UI",
                    system-ui,
                    -apple-system,
                    Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                overflow-x: hidden;
                line-height: 1.5;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                background:
                    radial-gradient(
                        900px 500px at 8% -10%,
                        rgba(124, 92, 255, 0.26),
                        transparent 60%
                    ),
                    radial-gradient(
                        800px 500px at 100% 0,
                        rgba(34, 211, 238, 0.16),
                        transparent 55%
                    ),
                    radial-gradient(
                        700px 500px at 60% 110%,
                        rgba(255, 107, 203, 0.13),
                        transparent 60%
                    );
            }
            a {
                color: inherit;
                text-decoration: none;
            }
            button {
                font: inherit;
                color: inherit;
                cursor: pointer;
                border: 0;
                background: none;
            }
            .ic {
                width: 22px;
                height: 22px;
                flex: none;
            }
            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }
            ::-webkit-scrollbar-thumb {
                background: var(--line);
                border-radius: 8px;
            }

            /* ---------- Top bar ---------- */
            .topbar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: var(--hh);
                z-index: 60;
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 0 16px;
                background: var(--glass);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-bottom: 1px solid var(--line);
            }
            .icon-btn {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                transition: 0.2s;
            }
            .icon-btn:hover {
                background: var(--surface2);
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 800;
                font-size: 1.15rem;
                letter-spacing: 0.2px;
            }
            .brand b {
                background: var(--grad);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            .logo {
                width: 36px;
                height: 36px;
                border-radius: 11px;
                background: var(--grad);
                display: grid;
                place-items: center;
                color: #fff;
                box-shadow: 0 6px 18px rgba(124, 92, 255, 0.5);
            }
            .search {
                position: relative;
                flex: 1;
                max-width: 620px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 0 14px;
                height: 44px;
                transition: 0.2s;
            }
            .search:focus-within {
                border-color: var(--a1);
                box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.2);
            }
            .search input {
                flex: 1;
                min-width: 0;
                background: none;
                border: 0;
                outline: 0;
                color: var(--text);
                font: inherit;
                padding: 0 10px;
                height: 100%;
            }
            .search input::placeholder {
                color: var(--muted);
            }
            .search kbd {
                font:
                    12px Consolas,
                    monospace;
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 1px 7px;
                color: var(--muted);
            }
            .sugg {
                position: absolute;
                top: 52px;
                left: 0;
                right: 0;
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 16px;
                box-shadow: var(--shadow);
                padding: 6px;
                display: none;
                z-index: 70;
            }
            .sugg.on {
                display: block;
            }
            .sugg a {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 9px 10px;
                border-radius: 10px;
            }
            .sugg a:hover {
                background: var(--surface2);
            }
            .sugg small {
                display: block;
                color: var(--muted);
                font-size: 0.78rem;
            }
            .sugg .none {
                padding: 12px;
                color: var(--muted);
            }
            .sb {
                font:
                    700 0.68rem Consolas,
                    monospace;
                color: #fff;
                border-radius: 8px;
                padding: 6px 8px;
                white-space: nowrap;
            }

            /* ---------- Sidebar ---------- */
            .sidebar {
                position: fixed;
                top: var(--hh);
                left: 0;
                bottom: 0;
                width: var(--sw);
                z-index: 50;
                overflow-y: auto;
                padding: 14px 12px 30px;
                background: var(--glass);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-right: 1px solid var(--line);
                transform: translateX(-100%);
                transition: transform 0.28s;
            }
            body:not(.watching):not(.collapsed) .sidebar {
                transform: none;
            }
            body.sbopen .sidebar {
                transform: none !important;
            }
            main {
                margin-left: 0;
                padding-top: var(--hh);
                min-height: 100vh;
                transition: margin 0.28s;
            }
            body:not(.watching):not(.collapsed) main {
                margin-left: var(--sw);
            }
            @media (max-width: 960px) {
                body:not(.watching):not(.collapsed) .sidebar {
                    transform: translateX(-100%);
                }
                body:not(.watching):not(.collapsed) main {
                    margin-left: 0;
                }
                .brand-t {
                    display: none;
                }
            }
            .scrim {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.55);
                z-index: 45;
                display: none;
            }
            body.sbopen .scrim {
                display: block;
            }
            @media (min-width: 961px) {
                body:not(.watching).sbopen .scrim {
                    display: none;
                }
            }
            .nav-h {
                font-size: 0.72rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--muted);
                padding: 16px 12px 6px;
                font-weight: 700;
            }
            .nav {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 10px 12px;
                border-radius: 12px;
                font-size: 0.93rem;
                transition: 0.2s;
                position: relative;
            }
            .nav:hover {
                background: var(--surface2);
            }
            .nav.on {
                background: var(--surface2);
                font-weight: 700;
            }
            .nav.on::before {
                content: "";
                position: absolute;
                left: 0;
                top: 9px;
                bottom: 9px;
                width: 3px;
                border-radius: 3px;
                background: var(--grad);
            }
            .nav small {
                margin-left: auto;
                color: var(--muted);
                font-size: 0.78rem;
            }
            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                margin: 0 6px;
            }

            /* ---------- Layout blocks ---------- */
            .page {
                padding: 22px 28px 40px;
            }
            @media (max-width: 600px) {
                .page {
                    padding: 16px;
                }
            }
            .hero {
                display: grid;
                grid-template-columns: 1.3fr 1fr;
                gap: 28px;
                align-items: center;
                padding: 42px;
                border-radius: 30px;
                margin-bottom: 26px;
                position: relative;
                overflow: hidden;
                background: linear-gradient(
                    135deg,
                    rgba(124, 92, 255, 0.28),
                    rgba(34, 211, 238, 0.14) 55%,
                    rgba(255, 107, 203, 0.18)
                );
                border: 1px solid var(--line);
            }
            @media (max-width: 980px) {
                .hero {
                    grid-template-columns: 1fr;
                    padding: 28px;
                }
                .hero-r {
                    display: none;
                }
            }
            .pill {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 6px 14px;
                font-size: 0.82rem;
                color: var(--muted);
            }
            .pill .ic {
                width: 16px;
                height: 16px;
            }
            .hero h1 {
                font-size: clamp(1.9rem, 4vw, 3.1rem);
                line-height: 1.12;
                margin: 16px 0;
                font-weight: 800;
                letter-spacing: -0.5px;
            }
            .gt {
                background: linear-gradient(90deg, #a78bfa, #22d3ee, #ff6bcb);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            .hero p {
                color: var(--muted);
                max-width: 620px;
                font-size: 1.02rem;
            }
            .hero p b {
                color: var(--text);
            }
            .cta {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                margin: 22px 0;
            }
            .btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 11px 20px;
                border-radius: 999px;
                font-weight: 700;
                border: 1px solid var(--line);
                background: var(--surface);
                transition: 0.2s;
            }
            .btn:hover {
                transform: translateY(-2px);
                background: var(--surface2);
            }
            .btn .ic {
                width: 18px;
                height: 18px;
            }
            .btn.primary {
                background: var(--grad);
                color: #fff;
                border-color: transparent;
                box-shadow: 0 8px 24px rgba(124, 92, 255, 0.45);
            }
            .stats {
                display: flex;
                flex-wrap: wrap;
                gap: 26px;
                margin-top: 10px;
            }
            .stats div b {
                display: block;
                font-size: 1.9rem;
                font-weight: 800;
            }
            .stats div span {
                color: var(--muted);
                font-size: 0.82rem;
            }
            .orbit {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
            .tile {
                aspect-ratio: 1;
                border-radius: 22px;
                display: grid;
                place-items: center;
                font-weight: 800;
                font-size: 0.95rem;
                color: #fff;
                box-shadow: var(--shadow);
                animation: float 5s ease-in-out infinite;
            }
            .tile:nth-child(2n) {
                animation-delay: -1.6s;
            }
            .tile:nth-child(3n) {
                animation-delay: -3.1s;
            }
            @keyframes float {
                50% {
                    transform: translateY(-12px) rotate(2deg);
                }
            }
            .how {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
                gap: 14px;
                margin-bottom: 26px;
            }
            .how div {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 20px;
                padding: 18px;
            }
            .how .ic {
                width: 26px;
                height: 26px;
                color: var(--a2);
                margin-bottom: 8px;
            }
            .how h4 {
                margin-bottom: 4px;
            }
            .how p {
                color: var(--muted);
                font-size: 0.88rem;
            }

            .asgcards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 16px;
                margin-bottom: 26px;
            }
            .asgcard {
                display: block;
                border-radius: 22px;
                padding: 22px;
                border: 1px solid var(--line);
                background: var(--surface);
                transition: 0.25s;
                position: relative;
                overflow: hidden;
            }
            .asgcard:hover {
                transform: translateY(-4px);
                border-color: var(--a1);
            }
            .asgcard::after {
                content: "";
                position: absolute;
                right: -40px;
                top: -40px;
                width: 150px;
                height: 150px;
                border-radius: 50%;
                background: var(--grad);
                opacity: 0.18;
            }
            .asgcard small {
                color: var(--a2);
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                font-size: 0.72rem;
            }
            .asgcard h3 {
                font-size: 1.25rem;
                margin: 6px 0 10px;
            }
            .asgcard ul {
                list-style: none;
                display: grid;
                gap: 6px;
                color: var(--muted);
                font-size: 0.88rem;
            }
            .asgcard li b {
                color: var(--text);
            }

            .chips {
                display: flex;
                gap: 10px;
                overflow-x: auto;
                padding: 4px 0 18px;
                position: sticky;
                top: var(--hh);
                z-index: 20;
                background: linear-gradient(var(--bg) 70%, transparent);
            }
            .chip {
                white-space: nowrap;
                padding: 8px 16px;
                border-radius: 10px;
                background: var(--surface2);
                font-size: 0.88rem;
                font-weight: 600;
                transition: 0.2s;
                border: 1px solid transparent;
            }
            .chip:hover {
                border-color: var(--a1);
            }
            .chip.on {
                background: var(--text);
                color: var(--bg);
            }
            .block {
                margin-bottom: 34px;
            }
            .bh {
                display: flex;
                align-items: baseline;
                gap: 12px;
                margin-bottom: 14px;
                flex-wrap: wrap;
            }
            .bh h2 {
                font-size: 1.3rem;
            }
            .bh span {
                color: var(--muted);
                font-size: 0.88rem;
            }
            .bh a {
                margin-left: auto;
                color: var(--a2);
                font-weight: 600;
                font-size: 0.88rem;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
                gap: 22px 18px;
            }

            /* ---------- Cards ---------- */
            .card {
                position: relative;
                transition: transform 0.25s;
            }
            .card:hover {
                transform: translateY(-5px);
            }
            .thumb {
                display: block;
                position: relative;
                aspect-ratio: 16/9;
                border-radius: 16px;
                overflow: hidden;
                background: var(--g);
                border: 1px solid var(--line);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
                isolation: isolate;
            }
            .thumb::after {
                content: "";
                position: absolute;
                inset: 0;
                z-index: 2;
                background: linear-gradient(
                    transparent 55%,
                    rgba(0, 0, 0, 0.4)
                );
            }
            .thumb iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 1280px;
                height: 720px;
                border: 0;
                transform-origin: 0 0;
                transform: scale(var(--s, 0.3));
                pointer-events: none;
                background: #fff;
                opacity: 0;
                transition: opacity 0.5s;
                z-index: 1;
            }
            .thumb.ready iframe {
                opacity: 1;
            }
            .thumb .shim {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    100deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.22) 50%,
                    transparent 70%
                );
                background-size: 200% 100%;
                animation: shim 1.4s infinite;
            }
            .thumb.ready .shim {
                display: none;
            }
            @keyframes shim {
                from {
                    background-position: 200% 0;
                }
                to {
                    background-position: -200% 0;
                }
            }
            .badge,
            .marks {
                position: absolute;
                z-index: 3;
                bottom: 8px;
                font:
                    700 0.72rem Consolas,
                    monospace;
                padding: 3px 8px;
                border-radius: 7px;
                background: rgba(0, 0, 0, 0.78);
                color: #fff;
            }
            .badge {
                right: 8px;
            }
            .marks {
                left: 8px;
                background: var(--grad);
            }
            .qno {
                position: absolute;
                z-index: 3;
                top: 8px;
                left: 8px;
                font:
                    700 0.72rem Consolas,
                    monospace;
                padding: 3px 8px;
                border-radius: 7px;
                background: rgba(0, 0, 0, 0.78);
                color: #fff;
            }
            .play {
                position: absolute;
                z-index: 3;
                inset: 0;
                display: grid;
                place-items: center;
                opacity: 0;
                transition: 0.25s;
            }
            .play span {
                width: 54px;
                height: 54px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.65);
                display: grid;
                place-items: center;
                color: #fff;
                backdrop-filter: blur(4px);
            }
            .card:hover .play {
                opacity: 1;
            }
            .txtthumb {
                position: absolute;
                inset: 0;
                z-index: 1;
                display: flex;
                flex-direction: column;
                gap: 9px;
                justify-content: center;
                padding: 18px 24px;
            }
            .txtthumb b {
                color: #fff;
                font-size: 1.05rem;
                margin-bottom: 4px;
            }
            .txtthumb i {
                height: 7px;
                border-radius: 5px;
                background: rgba(255, 255, 255, 0.55);
            }
            .txtthumb i:nth-child(3) {
                width: 80%;
            }
            .txtthumb i:nth-child(4) {
                width: 60%;
            }
            .txtthumb i:nth-child(5) {
                width: 70%;
            }
            .meta {
                display: flex;
                gap: 12px;
                padding: 12px 4px 0;
                align-items: flex-start;
            }
            .avatar {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: var(--g);
                display: grid;
                place-items: center;
                font:
                    800 0.68rem Consolas,
                    monospace;
                color: #fff;
                flex: none;
            }
            .meta h3 {
                font-size: 0.98rem;
                line-height: 1.3;
                font-weight: 700;
            }
            .meta h3 a:hover {
                color: var(--a2);
            }
            .meta p {
                color: var(--muted);
                font-size: 0.8rem;
                margin-top: 2px;
            }
            .tagrow {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-top: 6px;
            }
            .tagrow span {
                font-size: 0.68rem;
                padding: 2px 8px;
                border-radius: 6px;
                background: var(--surface2);
                color: var(--muted);
            }
            .fav {
                margin-left: auto;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                color: var(--muted);
                flex: none;
                transition: 0.2s;
            }
            .fav:hover {
                background: var(--surface2);
                color: var(--a3);
            }
            .fav .ic {
                width: 19px;
                height: 19px;
            }
            .fav.on {
                color: var(--a3);
            }
            .fav.on .ic {
                fill: currentColor;
            }
            .empty {
                text-align: center;
                padding: 70px 20px;
                color: var(--muted);
                background: var(--surface);
                border: 1px dashed var(--line);
                border-radius: 22px;
            }
            .empty .ic {
                width: 44px;
                height: 44px;
                margin-bottom: 10px;
                color: var(--a1);
            }

            /* ---------- Watch page ---------- */
            .watch {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 370px;
                gap: 26px;
                padding: 20px 28px 40px;
            }
            @media (max-width: 1150px) {
                .watch {
                    grid-template-columns: 1fr;
                }
            }
            @media (max-width: 600px) {
                .watch {
                    padding: 12px;
                }
            }
            .devbar {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 12px;
                flex-wrap: wrap;
            }
            .devbar .seg {
                display: flex;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 4px;
            }
            .devbar .seg button {
                padding: 7px 12px;
                border-radius: 9px;
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 0.85rem;
                color: var(--muted);
            }
            .devbar .seg button.on {
                background: var(--grad);
                color: #fff;
            }
            .devbar .seg .ic {
                width: 17px;
                height: 17px;
            }
            .devbar .sp {
                flex: 1;
            }
            .frame {
                margin: 0 auto;
                width: 100%;
                max-width: 100%;
                transition: width 0.4s;
                border-radius: 18px;
                overflow: hidden;
                border: 1px solid var(--line);
                background: var(--bg2);
                box-shadow: var(--shadow);
            }
            .chrome {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 14px;
                background: var(--bg2);
                border-bottom: 1px solid var(--line);
            }
            .chrome i {
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background: #ff5f57;
            }
            .chrome i:nth-child(2) {
                background: #febc2e;
            }

                    html = viewHome();
                } else if (r === "a1" || r === "a2") {
                    const a = r === "a1" ? 1 : 2,
                        l = PAGES.filter((i) => i.asg === a);
                    html = listView(
                        `Assignment ${a}: ${ASG[a].title}`,
                        `${l.length} programs &bull; ${ASG[a].max} marks`,
                        l,
                        "",
                    );
                    nav = r;
                    title = `Assignment ${a}`;
                } else if (r === "s" && SEC[p]) {
                    const l = PAGES.filter((i) => i.sec === p),
                        s = SEC[p];
                    html = listView(
                        `Assignment ${s.asg} &bull; Q${s.q}. ${s.title}`,
                        `${s.unit} &bull; ${l.length} programs &bull; ${s.total} marks`,
                        l,
                        "",
                    );
                    nav = "s/" + p;
                    title = s.title;
                } else if (r === "fav") {
                    html = listView(
                        "Favorites",
                        `${favs.size} saved`,
                        ITEMS.filter((i) => favs.has(i.id)),
                        "Tap the heart on any card to save it here.",
                    );
                    nav = "fav";
                    title = "Favorites";
                } else if (r === "history") {
                    html = listView(
                        "Recently opened",
                        "Your last viewed programs",
                        hist.map(byId).filter(Boolean),
                        "Programs you open will appear here.",
                    );
                    nav = "history";
                    title = "Recently opened";
                } else if (r === "notes") {
                    html = listView("Written answers", "Text files", NOTES, "");
                    nav = "notes";
                    title = "Written answers";
                } else if (r === "search") {
                    const l = searchItems(p);
                    html = listView(
                        `Results for "${esc(p)}"`,
                        `${l.length} found`,
                        l,
                        "Try a different word such as form, loop, carousel or JSON.",
                    );
                    nav = "";
                    title = "Search: " + p;
                    search.value = p;
                } else if (r === "watch" && byId(p)) {
                    it = byId(p);
                    html = viewWatch(it);
                    nav = it.type === "page" ? "s/" + it.sec : "notes";
                    title = it.title;
                    hist = [it.id, ...hist.filter((x) => x !== it.id)].slice(
                        0,
                        20,
                    );
                    store.set("wtl-hist", hist);
                } else {
                    html = viewHome();
                }

                if (r !== "search") search.value = "";
                document.title = title + " | " + CONFIG.site;
                view.innerHTML = html;
                setActiveNav(nav);
                if (keep !== true) window.scrollTo(0, 0);
                if (it) bindWatch(it);
                else initThumbs();
                countUp();
            }
            window.addEventListener("hashchange", () => route());

            /* ---------- Clicks inside the main view ---------- */
            view.addEventListener("click", (e) => {
                const f = e.target.closest("[data-fav]");
                if (f) {
                    const id = f.dataset.fav;
                    if (favs.has(id)) {
                        favs.delete(id);
                        toast("Removed from favorites");
                    } else {
                        favs.add(id);
                        toast("Added to favorites");
                    }
                    store.set("wtl-fav", [...favs]);
                    document
                        .querySelectorAll(`[data-fav="${id}"]`)
                        .forEach((b) => b.classList.toggle("on", favs.has(id)));
                    if (location.hash.startsWith("#/fav")) {
                        const y = window.scrollY;
                        route(true);
                        window.scrollTo(0, y);
                    }
                    return;
                }
                const c = e.target.closest("[data-chip]");
                if (c) {
                    chip = c.dataset.chip;
                    const y = window.scrollY;
                    route(true);
                    window.scrollTo(0, y);
                    return;
                }
                const a = e.target.closest("[data-act]");
                if (!a) return;
                const act = a.dataset.act;
                if (act === "reload") {
                    const pl = $("#player");
                    pl.src = pl.src;
                }
                if (act === "full") {
                    const fr = $("#frame");
                    (
                        fr.requestFullscreen ||
                        fr.webkitRequestFullscreen ||
                        (() => toast("Fullscreen not supported"))
                    ).call(fr);
                }
                if (act === "link") {
                    copy(location.href, "Share link copied");
                }
                if (act === "copysrc") {
                    currentSrc
                        ? copy(currentSrc, "Code copied")
                        : toast("Source is not loaded");
                }
            });
            function copy(text, msg) {
                if (navigator.clipboard && window.isSecureContext)
                    navigator.clipboard.writeText(text).then(
                        () => toast(msg),
                        () => toast("Copy failed"),
                    );
                else {
                    const t = document.createElement("textarea");
                    t.value = text;
                    document.body.appendChild(t);
                    t.select();
                    try {
                        document.execCommand("copy");
                        toast(msg);
                    } catch {
                        toast("Copy failed");
                    }
                    t.remove();
                }
            }

            /* ---------- Search box ---------- */
            const q = $("#q"),
                sugg = $("#sugg");
            q.addEventListener("input", () => {
                const v = q.value.trim();
                if (!v) {
                    sugg.classList.remove("on");
                    if (location.hash.startsWith("#/search"))
                        location.hash = "#/";
                    return;
                }
                const res = searchItems(v).slice(0, 6);
                sugg.innerHTML =
                    res
                        .map(
                            (i) =>
                                `<a href="#/watch/${i.id}"><span class="sb" style="background:${secOf(i).g}">${i.file.replace(".html", "").replace(".txt", "")}</span><span>${esc(i.title)}<small>${esc(secOf(i).short)}</small></span></a>`,
                        )
                        .join("") ||
                    '<div class="none">No matching program</div>';
                sugg.classList.add("on");
            });
            q.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && q.value.trim()) {
                    location.hash =
                        "#/search/" + encodeURIComponent(q.value.trim());
                    sugg.classList.remove("on");
                    q.blur();
                }
            });
            q.addEventListener("focus", () => {
                if (q.value.trim()) sugg.classList.add("on");
            });
            document.addEventListener("click", (e) => {
                if (
                    !e.target.closest("#searchBox") ||
                    e.target.closest(".sugg a")
                )
                    sugg.classList.remove("on");
            });

            /* ---------- Keyboard shortcuts ---------- */
            document.addEventListener("keydown", (e) => {
                const typing = /INPUT|TEXTAREA/.test(
                    document.activeElement.tagName,
                );
                if (e.key === "/" && !typing) {
                    e.preventDefault();
                    q.focus();
                }
                if (e.key === "Escape") {
                    sugg.classList.remove("on");
                    document.body.classList.remove("sbopen");
                    if (typing) document.activeElement.blur();
                    else if (location.hash.startsWith("#/watch")) {
                        const it = byId(location.hash.split("/")[2]);
                        if (it)
                            location.hash =
                                it.type === "page"
                                    ? "#/s/" + it.sec
                                    : "#/notes";
                    }
                }
                if (
                    (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
                    !typing &&
                    location.hash.startsWith("#/watch")
                ) {
                    const it = byId(location.hash.split("/")[2]);
                    if (!it) return;
                    const pool = it.type === "page" ? PAGES : NOTES,
                        n =
                            pool[
                                pool.indexOf(it) +
                                    (e.key === "ArrowRight" ? 1 : -1)
                            ];
                    if (n) location.hash = "#/watch/" + n.id;
                }
            });

            /* ---------- Start ---------- */
            buildSidebar();
            route();
        </script>
    </body>
</html>
